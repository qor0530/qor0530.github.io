<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qor0530.os</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="boot-screen">
        <div class="boot-content">
            <div class="boot-logo">qor0530.os</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="boot-text">Booting...</div>
        </div>
    </div>

    <div id="desktop" style="display: none;">
        <div id="cube-background"></div>
        <div id="desktop-icons"></div>
        <div id="windows-container"></div>
        <div id="taskbar">
            <div class="taskbar-items"></div>
        </div>
    </div>

    <div id="alt-tab-overlay" style="display: none;">
        <div class="alt-tab-container"></div>
    </div>

    <div id="context-menu" style="display: none;">
        <div class="context-menu-item" data-action="close">Close</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/boot.js"></script>
    <script src="js/window-manager.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/cube-animation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
